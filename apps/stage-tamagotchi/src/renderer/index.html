<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ALICIZATION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <style>
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        pointer-events: auto;
      }

      #boot-fallback[data-state="failed"] {
        display: flex;
      }

      #boot-fallback-card {
        width: min(560px, calc(100vw - 48px));
        border: 1px solid rgb(148 163 184 / 0.45);
        border-radius: 18px;
        background: rgb(15 23 42 / 0.92);
        box-shadow: 0 24px 80px rgb(15 23 42 / 0.45);
        padding: 18px;
        backdrop-filter: blur(16px);
      }

      #boot-fallback-title {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 700;
      }

      #boot-fallback-message {
        margin: 0;
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src-elem 'self' 'unsafe-eval' https://cdn.jsdelivr.net/;
      script-src 'self' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      font-src 'self' https://fonts.gstatic.com/;
      connect-src 'self' https://cdn.jsdelivr.net/ blob: https://openrouter.ai/"
    /> -->
    <script src="./assets/js/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js"></script>
  </head>

  <body class="font-sans">
    <div id="boot-fallback" data-state="booting">
      <div id="boot-fallback-card">
        <p id="boot-fallback-title">Alicization 渲染启动失败</p>
        <pre id="boot-fallback-message">主界面没有完成挂载。请打开日志或重启应用后再试。</pre>
      </div>
    </div>
    <div id="app"></div>
    <script>
      window.setTimeout(() => {
        const fallback = document.getElementById('boot-fallback')
        const message = document.getElementById('boot-fallback-message')
        if (!fallback || fallback.dataset.state !== 'booting')
          return

        fallback.dataset.state = 'failed'
        if (message)
          message.textContent = '渲染启动超时：主界面没有完成挂载。'
      }, 8000)
    </script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
