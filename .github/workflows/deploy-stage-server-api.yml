name: Deploy Stage Server API

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/deploy-stage-server-api.yml'
      - 'apps/server/**'
      - 'packages/server-schema/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy server (same-domain API)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: 103.85.226.171
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE_REPO_DIR: ${{ secrets.SERVER_REPO_DIR || '/opt/alicization' }}
      API_SERVER_URL: ${{ secrets.API_SERVER_URL || 'https://alz.tohoqing.com' }}
      AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SERVER_AUTH_GOOGLE_CLIENT_ID || secrets.AUTH_GOOGLE_CLIENT_ID }}
      AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SERVER_AUTH_GOOGLE_CLIENT_SECRET || secrets.AUTH_GOOGLE_CLIENT_SECRET }}
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.SERVER_AUTH_GITHUB_CLIENT_ID || secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.SERVER_AUTH_GITHUB_CLIENT_SECRET || secrets.AUTH_GITHUB_CLIENT_SECRET }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "::error::Missing secret: DEPLOY_USER"; exit 1; }
          test -n "${AUTH_GOOGLE_CLIENT_ID}" || { echo "::error::Missing secret: SERVER_AUTH_GOOGLE_CLIENT_ID (or AUTH_GOOGLE_CLIENT_ID)"; exit 1; }
          test -n "${AUTH_GOOGLE_CLIENT_SECRET}" || { echo "::error::Missing secret: SERVER_AUTH_GOOGLE_CLIENT_SECRET (or AUTH_GOOGLE_CLIENT_SECRET)"; exit 1; }
          test -n "${AUTH_GITHUB_CLIENT_ID}" || { echo "::error::Missing secret: SERVER_AUTH_GITHUB_CLIENT_ID (or AUTH_GITHUB_CLIENT_ID)"; exit 1; }
          test -n "${AUTH_GITHUB_CLIENT_SECRET}" || { echo "::error::Missing secret: SERVER_AUTH_GITHUB_CLIENT_SECRET (or AUTH_GITHUB_CLIENT_SECRET)"; exit 1; }

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync repository on remote host
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -euo pipefail
            if [ ! -d '${REMOTE_REPO_DIR}/.git' ]; then
              git clone --depth 1 'https://github.com/${{ github.repository }}.git' '${REMOTE_REPO_DIR}'
            else
              if ! git -C '${REMOTE_REPO_DIR}' diff --quiet || ! git -C '${REMOTE_REPO_DIR}' diff --cached --quiet; then
                echo 'Remote repo has local changes. Please clean it before running deploy.'
                exit 1
              fi
              git -C '${REMOTE_REPO_DIR}' fetch --depth 1 origin main
              git -C '${REMOTE_REPO_DIR}' checkout main
              git -C '${REMOTE_REPO_DIR}' pull --ff-only origin main
            fi
          "

      - name: Upload server env file
        run: |
          set -euo pipefail
          {
            printf 'API_SERVER_URL=%s\n' "${API_SERVER_URL}"
            printf 'AUTH_GOOGLE_CLIENT_ID=%s\n' "${AUTH_GOOGLE_CLIENT_ID}"
            printf 'AUTH_GOOGLE_CLIENT_SECRET=%s\n' "${AUTH_GOOGLE_CLIENT_SECRET}"
            printf 'AUTH_GITHUB_CLIENT_ID=%s\n' "${AUTH_GITHUB_CLIENT_ID}"
            printf 'AUTH_GITHUB_CLIENT_SECRET=%s\n' "${AUTH_GITHUB_CLIENT_SECRET}"
          } > /tmp/stage-server.env
          scp -P "${DEPLOY_PORT}" /tmp/stage-server.env "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_REPO_DIR}/apps/server/.env"

      - name: Deploy db + server with Docker Compose
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -euo pipefail
            cd '${REMOTE_REPO_DIR}/apps/server'
            docker compose pull db || true
            docker compose up -d --build db server
            docker compose ps
            curl -fsS 'http://127.0.0.1:6112/health'
          "
