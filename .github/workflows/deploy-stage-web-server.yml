name: Deploy Stage Web Server

on:
  push:
    branches:
      - 'main'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy - ${{ matrix.app_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    strategy:
      matrix:
        include:
          - app_name: stage-web
            environment_name: Production
            environment_url: http://36.212.197.121
            dist_directory: ./apps/stage-web/dist
            deploy_host: 36.212.197.121
            deploy_path: /www/wwwroot/alizication
            command: |
              pnpm -F @proj-alicization/stage-web run build

              pnpm -F @proj-alicization/docs run build:base
              mv ./docs/.vitepress/dist ./apps/stage-web/dist/docs
              cp ./apps/stage-web/dist/docs/sitemap.xml ./apps/stage-web/dist/sitemap.xml

              pnpm -F @proj-alicization/stage-ui run story:build
              mv ./packages/stage-ui/.histoire/dist ./apps/stage-web/dist/ui

    environment:
      name: ${{ matrix.environment_name }}
      url: ${{ matrix.environment_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages

      - run: ${{ matrix.command }}
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          WARP_DRIVE_PUBLIC_BASE: ${{ secrets.WARP_DRIVE_PUBLIC_BASE }}

      - run: |
          CI=true pnpm install -g @posthog/cli
          pnpm exec posthog-cli sourcemap inject --directory ${{ matrix.dist_directory }}
          pnpm exec posthog-cli sourcemap upload --directory ${{ matrix.dist_directory }}
        env:
          POSTHOG_CLI_ENV_ID: ${{ secrets.POSTHOG_ENV_ID }}
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
        continue-on-error: true

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ matrix.deploy_host }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_USER }}@${{ matrix.deploy_host }}" \
            "mkdir -p '${{ matrix.deploy_path }}'"

      - name: Upload stage-web dist
        run: |
          rsync -az --delete \
            --filter='P .user.ini' \
            -e "ssh -p ${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ matrix.dist_directory }}/" \
            "${{ secrets.DEPLOY_USER }}@${{ matrix.deploy_host }}:${{ matrix.deploy_path }}/"
