devtools:
  title: Developer
  pages:
    context-flow:
      title: Context Flow
    lag-visualizer:
      title: Lag Visualizer
    performance-visualizer:
      title: Performance Visualizer
      description: Toggle FPS/long task/memory overlay
    markdown-stress:
      title: Markdown Stress
      description: Stress markdown parsing and rendering with heavy chat payloads
    widgets-calling:
      title: Widget Calling
      description: Spawn, update, and remove floating widgets for desktop integration tests.
      hint: Use presets to quickly populate component props before dispatching.
      presets:
        weather:
          label: Weather Preset
          data:
            city: Tokyo
            condition: Light Rain
        map:
          label: Map Preset
          data:
            title: Airport Route
            mode: Airport Bus
            status: On time
            origin: Home
            stop_1: Stop 1
            stop_2: Transfer
            stop_3: Terminal
      size_presets:
        small: Small
        medium: Medium
        large: Large
        custom: Custom
      fields:
        widget_id:
          label: Widget ID
          description: Reuse an existing widget ID to replace or update that widget window.
          placeholder: Leave empty to auto-generate
        component_name:
          label: Component Name
          description: Registered widget component to render, for example weather or map.
          placeholder: weather
        size_preset:
          label: Size Preset
          description: Choose a preset size or switch to custom grid dimensions.
          placeholder: Select a size preset...
        custom_columns:
          label: Custom Columns
          description: Grid columns used when the size preset is custom.
        custom_rows:
          label: Custom Rows
          description: Grid rows used when the size preset is custom.
        ttl:
          label: Auto-remove After (seconds)
          description: Set 0 to keep the widget until it is removed manually.
        component_props:
          label: Component Props (JSON)
          description: JSON payload passed to the widget component.
      actions:
        spawn_replace: Spawn / Replace Widget
        update_props: Update Props
        remove_widget: Remove Widget
        clear_all: Clear All Widgets
      feedback:
        spawned: 'Widget window prepared{suffix}'
        updated: 'Updated widget {id}'
        removed: 'Removed widget {id}'
        cleared: Removed all widgets
      errors:
        invalid_json: 'Invalid JSON: {error}'
        invalid_ttl: TTL must be 0 or a positive number.
        component_name_required: Component name is required.
        spawn_failed: Failed to spawn widget.
        widget_id_required_update: Widget ID is required to update props.
        update_failed: Failed to update widget props.
        widget_id_required_remove: Widget ID is required to remove a widget.
        remove_failed: Failed to remove widget.
        clear_failed: Failed to clear widgets.
