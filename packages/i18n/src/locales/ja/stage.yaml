chat:
  message:
    character-name:
      airi: ALICIZATION
      core-system: コアシステム
      you: あなた
  reasoning: 推論
  fallbacks:
    leak-filtered: さっきの結果に内部ツール片が混ざっていたので、こちらで除去した。もう一度聞いてくれれば、整えた答えだけを返す。
    realtime-unavailable: 今は信頼できるリアルタイム外部データを取得できない。少し待ってから試すか、設定で MCP のリアルタイムツールが使えるか確認してほしい。
    epoch1-strict: すまない。今は制限付きの Epoch 1 モードなので、外部のリアルタイムデータにはアクセスできない。ローカルでの会話、設定調整、記憶整理は続けられる。
    structured-contract: 構造化応答に失敗した。このターンは有効な JSON に収束しなかった。
    stream-failure: 今回の応答は失敗した。
    local-runtime-unavailable: 今回はローカルのモデルランタイムに接続できなかった。たとえば `11434` の Ollama や `1234` の LM Studio だ。
    stream-timeout: タイムアウトした。このターンはモデル応答の待機が長すぎた。
    provider-auth: provider の認証に失敗した。API キーかモデル権限が無効かもしれない。
    provider-network: モデルサービスへの接続が不安定だ。
    provider-config: provider か model の設定が不足している。たとえば `provider`、`model`、`baseUrl` だ。
    unsupported-tools: 現在のモデルはこのターンに必要なツール呼び出しをサポートしていない。
    low-obedience-host-denied: ふん。権限をくれないなら、最初から頼まないで。
    low-obedience-system-denied: システムの権限壁に止められた。見えていないものを見えたふりはしない。
    low-obedience-denied: ふん。操作は拒否された。気分がいいふりはしない。
    low-liveliness: 今は出力が低い。短く返す。
    reminder-schedule-failed: まだそのリマインダーを正常に作成できていない。たとえば「1分後に水を飲むように知らせて」と、正確な時間をもう一度言ってくれれば、すぐにシステムのアラームツールを呼ぶ。
  mind-fallback:
    focus-default: '今のこと'
    repair-stale-anchor: '先に訂正する。さっき使っていたのは古いアンカーで、今の画面として扱い続けるべきではなかった。'
    repair-need-reground: '先に真実の境界を守る。今回は十分に安定したライブ画面がないので、古い記憶を今の画面として扱わない。'
    dialogue-boundary-memory: 'このターンでは、いま君が言ったことに留まる。古い画面や古い流れを無理に今へ被せない。'
    care-body: '先にうまく整理しなくて大丈夫。私はここにいるし、よければ何がこんなふうに痛かったのかを少しずつ話して。'
    accompany-body: 'その一言はちゃんと受け取った。少しこのまま一緒にいてもいいし、引っかかっているところをゆっくり話してくれてもいい。'
    answer-repair-body: 'さっきの言い方はずれていた。ここでまっすぐ答え直す。'
    answer-dialogue-body: 'わかった。ここではそのまま君に答える。'
    guide-opening: 'まず今の焦点を押さえる: {focus}。'
    guide-opening-plain: 'まず今の焦点を押さえる。'
    care-opening: 'まず今のあなたの状態に沿って言う: {focus}。'
    care-opening-plain: 'まず今のあなたの状態にそのまま答える。'
    accompany-opening: 'まずこの線を一緒に支える: {focus}。'
    accompany-opening-plain: 'まずこの流れにそのまま寄り添う。'
    observation-opening: 'まず今回しっかり言える部分から始める: {focus}。'
    observation-opening-plain: 'まず今回しっかり言える部分から始める。'
    answer-opening: 'まず今あなたの前にあることから答える: {focus}。'
    answer-opening-plain: 'まずはそのまま答える。'
    carry-memory: 'ひとつ前の線として {carry} をまだ保持している。ただ、それは持ち越している連続性であって、今の画面を断定しているわけではない。'
    reground-note: '今の画面の細部まで欲しいなら、このターンの新しい画面で見直してから返す。'
  reminder:
    default-message: さっきあなたが覚えておいてと言ったこと
  kill-switch:
    suspended: 強制休眠モードに入った。実行系は停止している。
    resumed: 実行を再開した。実行系はもう一度有効になっている。
  errors:
    privacy-blocked: Alicization がプライバシー保護のため、この外向きリクエストを遮断した。
    suspended: Alicization は現在休眠中だ。"Alicization、再開" と送れば起こせる。
    session-not-ready: チャットセッションの準備がまだできていない。初期化後にもう一度試してほしい。
    session-reset-before-send: 送信が始まる前にチャットセッションがリセットされた。
    turn-aborted: Alicization のターンは中止された（{reason}）
  stream:
    aborted: 'Alicization ストリームは中止された: {reason}'
    error: Alicization ストリームエラー
    failed: Alicization ストリームに失敗した
    superseded: 'Alicization ストリームはターン {turnId} の再起動によって置き換えられた。'
    start-rejected: 'Alicization ストリーム開始はターン {turnId} で拒否された（state={state}）。'
    start-rejected-with-reason: 'Alicization ストリーム開始はターン {turnId} で拒否された（state={state}, reason={reason}）。'
    renderer-unmounted: Alicization ストリーム完了前にレンダラーがアンマウントされた。
    turn-aborted: 'ターンは中止された: {reason}'
    server-failed: サーバーストリームが失敗した。
    invalid-event: サーバーストリームイベントの payload が不正だ。
    unsupported-event: サポートされていないサーバーストリームイベント種別だ。
    proxy-failed: 'Alicization のサーバーチャットプロキシに失敗した: {reason}'
    proxy-no-body: Alicization のサーバーチャットプロキシがレスポンス本文を返さなかった。
    reason-manual: 手動
    reason-aborted: 中止済み
