screen-capture:
  permissions-prompt:
    title: 画面キャプチャ
    description: 画面またはウィンドウをキャプチャするには、画面とシステムのオーディオ録音の許可が必要です。
    open-preferences: システム設定を開く
    dismiss: 閉じる
    instructions:
      step-1: '「システム設定」を開き、サイドバーから「プライバシーとセキュリティ」を選択します。'
      step-2: '「画面&システム音声録音」および「システム音声録音のみ」のセクションで、Alicization用のスイッチをオンにしてください。'
      step-2-note: Alicizationが表示されていない場合は、「+」ボタンをクリックして「アプリケーション」フォルダから「Alicization」を選択して手動で追加してください。
  devtools:
    categories:
      applications: アプリケーション
      displays: ディスプレイ
      devices: デバイス
    actions:
      loading: 読み込み中...
      refetching: 更新中...
      refetch: 再読み込み
      share_screen: 画面を共有
      share_device: デバイスを共有
      share_window: ウィンドウを共有
      stop: 停止
    capture_status: 共有中のキャプチャ
    loading_sources: キャプチャソースを読み込み中...
    alt:
      thumbnail: キャプチャソースのサムネイル
      screen_icon: 画面アイコン
      window_icon: ウィンドウアイコン
    empty:
      title: このカテゴリにはソースがありません
      description: 別のカテゴリを試すか、キャプチャソース一覧を再読み込みしてください。
