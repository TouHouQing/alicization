pages:
  modules:
    mcp-server:
      description: MCPサーバーとツールの接続と管理
      title: MCPサーバー
  system:
    sections:
      section:
        window-shortcuts:
          title: キーボードショートカット
    window-shortcuts:
      description: ウィンドウ用ショートカットを変更します。
      title: ウィンドウショートカット
      toggle-move:
        label: 移動の切り替え
      toggle-resize:
        label: サイズ変更の切り替え
      toggle-ignore-mouse-event:
        label: マウスイベント無視の切り替え
      press-keys: 何かキーを押してください…
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse Tool
            description: Electronウィンドウのカーソル位置をテストします
          relative-mouse:
            formula_x: 'relativeX = cursorX - windowX'
            formula_y: 'relativeY = cursorY - windowY'
            window: 'ウィンドウ {width} x {height}'
            center: '中心 ({x}, {y})'
            legend: 緑の点はウィンドウ内での現在のカーソル位置を示します
devtools:
  title: 開発者
  pages:
    context-flow:
      title: コンテキストのフロー
    lag-visualizer:
      title: ラグビジュアライザー
    performance-visualizer:
      title: パフォーマンスビジュアライザー
      description: FPS/ロングタスク/メモリーオーバーレイの切り替え
    markdown-stress:
      title: Markdown ストレス
      description: 大量のチャットデータを含むMarkdownの解析とレンダリング負荷のテスト
    widgets-calling:
      title: ウィジェット呼び出し
      description: デスクトップ連携テスト用にフローティングウィジェットを生成、更新、削除します。
      hint: プリセットを使うと、送信前にコンポーネント props をすばやく埋められます。
      presets:
        weather:
          label: 天気プリセット
          data:
            city: 東京
            condition: 小雨
        map:
          label: 地図プリセット
          data:
            title: 空港ルート
            mode: 空港バス
            status: 定刻
            origin: 自宅
            stop_1: 停留所 1
            stop_2: 乗り換え
            stop_3: ターミナル
      size_presets:
        small: 小
        medium: 中
        large: 大
        custom: カスタム
      fields:
        widget_id:
          label: ウィジェット ID
          description: 既存のウィジェット ID を再利用すると、そのウィンドウを置き換えまたは更新します。
          placeholder: 空欄で自動生成
        component_name:
          label: コンポーネント名
          description: '描画する登録済みウィジェットコンポーネント名です。例: weather / map'
          placeholder: weather
        size_preset:
          label: サイズプリセット
          description: 既定サイズを選ぶか、カスタムグリッド寸法に切り替えます。
          placeholder: サイズプリセットを選択...
        custom_columns:
          label: カスタム列数
          description: サイズがカスタムの場合に使うグリッド列数です。
        custom_rows:
          label: カスタム行数
          description: サイズがカスタムの場合に使うグリッド行数です。
        ttl:
          label: 自動削除までの秒数
          description: 0 にすると手動で削除するまでウィジェットを保持します。
        component_props:
          label: コンポーネント Props (JSON)
          description: ウィジェットコンポーネントへ渡す JSON データです。
      actions:
        spawn_replace: 生成 / 置き換え
        update_props: Props を更新
        remove_widget: ウィジェットを削除
        clear_all: すべて削除
      feedback:
        spawned: 'ウィジェットウィンドウの準備ができました{suffix}'
        updated: 'ウィジェット {id} を更新しました'
        removed: 'ウィジェット {id} を削除しました'
        cleared: すべてのウィジェットを削除しました
      errors:
        invalid_json: 'JSON が無効です: {error}'
        invalid_ttl: TTL は 0 または正の数である必要があります。
        component_name_required: コンポーネント名は必須です。
        spawn_failed: ウィジェットの生成に失敗しました。
        widget_id_required_update: Props を更新するにはウィジェット ID が必要です。
        update_failed: ウィジェット props の更新に失敗しました。
        widget_id_required_remove: 削除するにはウィジェット ID が必要です。
        remove_failed: ウィジェットの削除に失敗しました。
        clear_failed: ウィジェットの一括削除に失敗しました。
