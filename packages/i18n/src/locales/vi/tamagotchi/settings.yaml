screen-capture:
  permissions-prompt:
    title: Chụp ảnh màn hình
    description: Để chụp màn hình hoặc cửa sổ, bạn cần cấp quyền ghi âm hệ thống và ghi màn hình.
    open-preferences: Mở Tùy chọn hệ thống
    dismiss: Bỏ qua
    instructions:
      step-1: Mở "Tùy chọn hệ thống", chọn "Quyền riêng tư & Bảo mật" từ thanh bên.
      step-2: Trong phần "Ghi màn hình & Âm thanh hệ thống" và "Chỉ ghi âm thanh hệ thống", hãy bật công tắc cho Alicization.
      step-2-note: Nếu không thấy Alicization trong danh sách, vui lòng thêm thủ công bằng cách nhấn nút "+" và chọn Alicization từ thư mục Ứng dụng (Applications).
  devtools:
    categories:
      applications: Ứng dụng
      displays: Màn hình
      devices: Thiết bị
    actions:
      loading: Đang tải...
      refetching: Đang làm mới...
      refetch: Làm mới
      share_screen: Chia sẻ màn hình
      share_device: Chia sẻ thiết bị
      share_window: Chia sẻ cửa sổ
      stop: Dừng
    capture_status: Đang ghi hình
    loading_sources: Đang tải nguồn chụp...
    alt:
      thumbnail: Ảnh thu nhỏ của nguồn chụp
      screen_icon: Biểu tượng màn hình
      window_icon: Biểu tượng cửa sổ
    empty:
      title: Không có nguồn nào trong danh mục này
      description: Hãy thử danh mục khác hoặc làm mới danh sách nguồn chụp.
