devtools:
  title: Nhà phát triển
  pages:
    context-flow:
      title: Luồng ngữ cảnh (Context Flow)
    lag-visualizer:
      title: Trình trực quan hóa độ trễ
    performance-visualizer:
      title: Trình trực quan hóa hiệu năng
      description: Bật/Tắt lớp phủ hiển thị FPS/tác vụ dài/bộ nhớ
    markdown-stress:
      title: Kiểm thử áp lực Markdown
      description: Kiểm tra khả năng xử lý và hiển thị Markdown với dữ liệu hội thoại lớn
    widgets-calling:
      title: Gọi Widget
      description: Tạo, cập nhật và xoá các widget nổi để kiểm thử tích hợp desktop.
      hint: Hãy dùng preset để điền nhanh props của component trước khi gửi.
      presets:
        weather:
          label: Preset thời tiết
          data:
            city: Tokyo
            condition: Mưa nhẹ
        map:
          label: Preset bản đồ
          data:
            title: Tuyến đường ra sân bay
            mode: Xe buýt sân bay
            status: Đúng giờ
            origin: Nhà
            stop_1: Điểm dừng 1
            stop_2: Trung chuyển
            stop_3: Nhà ga
      size_presets:
        small: Nhỏ
        medium: Vừa
        large: Lớn
        custom: Tùy chỉnh
      fields:
        widget_id:
          label: ID widget
          description: Dùng lại ID widget có sẵn để thay thế hoặc cập nhật cửa sổ đó.
          placeholder: Để trống để tự tạo
        component_name:
          label: Tên component
          description: Tên component widget đã đăng ký để hiển thị, ví dụ weather hoặc map.
          placeholder: weather
        size_preset:
          label: Preset kích thước
          description: Chọn kích thước có sẵn hoặc chuyển sang lưới tùy chỉnh.
          placeholder: Chọn preset kích thước...
        custom_columns:
          label: Cột tùy chỉnh
          description: Số cột lưới dùng khi kích thước ở chế độ tùy chỉnh.
        custom_rows:
          label: Hàng tùy chỉnh
          description: Số hàng lưới dùng khi kích thước ở chế độ tùy chỉnh.
        ttl:
          label: Tự xóa sau (giây)
          description: Đặt 0 để giữ widget cho đến khi bạn xóa thủ công.
        component_props:
          label: Props của component (JSON)
          description: Dữ liệu JSON truyền vào component widget.
      actions:
        spawn_replace: Tạo / Thay thế widget
        update_props: Cập nhật props
        remove_widget: Xóa widget
        clear_all: Xóa tất cả widget
      feedback:
        spawned: 'Cửa sổ widget đã sẵn sàng{suffix}'
        updated: 'Đã cập nhật widget {id}'
        removed: 'Đã xóa widget {id}'
        cleared: Đã xóa toàn bộ widget
      errors:
        invalid_json: 'JSON không hợp lệ: {error}'
        invalid_ttl: TTL phải bằng 0 hoặc là số dương.
        component_name_required: Bắt buộc phải có tên component.
        spawn_failed: Không thể tạo widget.
        widget_id_required_update: Cần có ID widget để cập nhật props.
        update_failed: Không thể cập nhật props của widget.
        widget_id_required_remove: Cần có ID widget để xóa.
        remove_failed: Không thể xóa widget.
        clear_failed: Không thể xóa toàn bộ widget.
