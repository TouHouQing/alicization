devtools:
  title: 開發者
  pages:
    context-flow:
      title: 上下文流程
    lag-visualizer:
      title: 卡頓可視化
    performance-visualizer:
      title: 效能顯示器
      description: 切換 FPS/長任務/記憶體覆蓋
    markdown-stress:
      title: Markdown Stress
      description: 使用大量聊天負載來進行 Markdown 解析與渲染的壓力測試
    widgets-calling:
      title: 小工具調用
      description: 用於建立、更新與移除桌面浮動小工具，方便測試桌面整合能力。
      hint: 先套用預設可快速填入元件參數，再送出小工具呼叫。
      presets:
        weather:
          label: 天氣預設
          data:
            city: 東京
            condition: 小雨
        map:
          label: 地圖預設
          data:
            title: 機場路線
            mode: 機場巴士
            status: 準點
            origin: 家
            stop_1: 第一站
            stop_2: 轉乘點
            stop_3: 航廈
      size_presets:
        small: 小
        medium: 中
        large: 大
        custom: 自訂
      fields:
        widget_id:
          label: 小工具 ID
          description: 重用既有的小工具 ID 時，會直接取代或更新對應視窗。
          placeholder: 留空則自動產生
        component_name:
          label: 元件名稱
          description: 要渲染的小工具元件名稱，例如 weather 或 map。
          placeholder: weather
        size_preset:
          label: 尺寸預設
          description: 選擇預設尺寸，或切換到自訂格線大小。
          placeholder: 請選擇尺寸預設...
        custom_columns:
          label: 自訂欄數
          description: 當尺寸為自訂時使用的格線欄數。
        custom_rows:
          label: 自訂列數
          description: 當尺寸為自訂時使用的格線列數。
        ttl:
          label: 自動移除時間（秒）
          description: 設為 0 代表保留小工具，直到手動移除。
        component_props:
          label: 元件參數（JSON）
          description: 傳遞給小工具元件的 JSON 資料。
      actions:
        spawn_replace: 建立 / 取代小工具
        update_props: 更新參數
        remove_widget: 移除小工具
        clear_all: 清空全部小工具
      feedback:
        spawned: '小工具視窗已就緒{suffix}'
        updated: '已更新小工具 {id}'
        removed: '已移除小工具 {id}'
        cleared: 已清空全部小工具
      errors:
        invalid_json: 'JSON 無效：{error}'
        invalid_ttl: TTL 必須為 0 或正數。
        component_name_required: 元件名稱不能為空。
        spawn_failed: 建立小工具失敗。
        widget_id_required_update: 更新參數時必須填寫小工具 ID。
        update_failed: 更新小工具參數失敗。
        widget_id_required_remove: 移除小工具時必須填寫小工具 ID。
        remove_failed: 移除小工具失敗。
        clear_failed: 清空小工具失敗。
