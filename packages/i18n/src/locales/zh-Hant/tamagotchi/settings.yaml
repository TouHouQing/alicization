screen-capture:
  permissions-prompt:
    title: 螢幕截圖
    description: 螢幕與語音錄製權限對於截取螢幕或視窗來說是必要的。
    open-preferences: 打開系統偏好設定
    dismiss: 取消
    instructions:
      step-1: 打開「系統偏好設定」，從側邊欄中選擇「隱私與安全」。
      step-2: 在「螢幕與系統聲音錄製」以及「系統聲音錄製」區域，開啟 Alicization 的開關。
      step-2-note: 如果 Alicization 沒有被列出，則請手動按下「+」按鈕並從應用資料夾選擇 Alicization。
  devtools:
    categories:
      applications: 應用視窗
      displays: 顯示器
      devices: 裝置
    actions:
      loading: 載入中...
      refetching: 重新整理中...
      refetch: 重新整理
      share_screen: 分享螢幕
      share_device: 分享裝置
      share_window: 分享視窗
      stop: 停止
    capture_status: 目前正在共享
    loading_sources: 正在載入可擷取來源...
    alt:
      thumbnail: 擷取來源縮圖
      screen_icon: 螢幕圖示
      window_icon: 視窗圖示
    empty:
      title: 此分類目前沒有可用來源
      description: 請切換分類，或重新整理擷取來源清單後再試一次。
