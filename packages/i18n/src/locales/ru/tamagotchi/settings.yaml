        medium: Средний
        large: Большой
        custom: Свой
      fields:
        widget_id:
          label: ID виджета
          description: Используйте существующий ID виджета, чтобы заменить или обновить это окно.
          placeholder: Оставьте пустым для автогенерации
        component_name:
          label: Имя компонента
          description: Имя зарегистрированного компонента виджета, например weather или map.
          placeholder: weather
        size_preset:
          label: Пресет размера
          description: Выберите готовый размер или перейдите к пользовательской сетке.
          placeholder: Выберите пресет размера...
        custom_columns:
          label: Пользовательские столбцы
          description: Количество столбцов сетки для пользовательского размера.
        custom_rows:
          label: Пользовательские строки
          description: Количество строк сетки для пользовательского размера.
        ttl:
          label: Автоудаление через (сек)
          description: Установите 0, чтобы виджет оставался до ручного удаления.
        component_props:
          label: Props компонента (JSON)
          description: JSON-данные, передаваемые компоненту виджета.
      actions:
        spawn_replace: Создать / заменить виджет
        update_props: Обновить props
        remove_widget: Удалить виджет
        clear_all: Очистить все виджеты
