screen-capture:
  permissions-prompt:
    title: Screen Capture
    description: To capture screens or windows, screen and system audio recording permissions are required.
    open-preferences: Open System Preferences
    dismiss: Dismiss
    instructions:
      step-1: Open "System Preferences", select "Privacy & Security" from the sidebar.
      step-2: In the "Screen & System Audio Recording" and "System Audio Recording Only" sections, turn on the switches for Alicization.
      step-2-note: If Alicization is not listed, please add it manually by clicking the "+" button and selecting Alicization from the Applications folder.
  devtools:
    categories:
      applications: Приложения
      displays: Дисплеи
      devices: Устройства
    actions:
      loading: Загрузка...
      refetching: Обновление...
      refetch: Обновить
      share_screen: Поделиться экраном
      share_device: Поделиться устройством
      share_window: Поделиться окном
      stop: Остановить
    capture_status: Активный захват
    loading_sources: Загрузка источников захвата...
    alt:
      thumbnail: Миниатюра источника захвата
      screen_icon: Значок экрана
      window_icon: Значок окна
    empty:
      title: В этой категории нет источников
      description: Попробуйте другую категорию или обновите список источников захвата.
