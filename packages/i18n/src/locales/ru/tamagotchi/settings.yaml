        removed: 'Виджет {id} удалён'
        cleared: Все виджеты удалены
      errors:
        invalid_json: 'Неверный JSON: {error}'
        invalid_ttl: TTL должен быть равен 0 или быть положительным числом.
        component_name_required: Имя компонента обязательно.
        spawn_failed: Не удалось создать виджет.
        widget_id_required_update: Для обновления props нужен ID виджета.
