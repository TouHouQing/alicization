screen-capture:
  permissions-prompt:
    title: Capture d'écran
    description: Pour capturer des écrans ou des fenêtres, les autorisations d’enregistrement de l'écran et de l'audio du système sont requises.
    open-preferences: Ouvrir les Préférences Système
    dismiss: Ignorer
    instructions:
      step-1: Ouvrir les "Préférences Système", sélectionnez "Confidentialité et Sécurité" dans la barre latérale.
      step-2: Dans les sections "Enregistrement de l'écran et de l'audio du système" et "Enregistrement de l'audio du système uniquement", activez les interrupteurs pour Alicization.
      step-2-note: Si Alicization n'est pas listé, veuillez l'ajouter manuellement en cliquant sur le bouton "+" et en sélectionnant Alicization dans le dossier Applications.
  devtools:
    categories:
      applications: Applications
      displays: Écrans
      devices: Appareils
    actions:
      loading: Chargement...
      refetching: Actualisation...
      refetch: Actualiser
      share_screen: Partager l’écran
      share_device: Partager l’appareil
      share_window: Partager la fenêtre
      stop: Arrêter
    capture_status: Capture active
    loading_sources: Chargement des sources de capture...
    alt:
      thumbnail: Miniature de la source de capture
      screen_icon: Icône d’écran
      window_icon: Icône de fenêtre
    empty:
      title: Aucune source dans cette catégorie
      description: Essayez une autre catégorie ou actualisez la liste des sources de capture.
