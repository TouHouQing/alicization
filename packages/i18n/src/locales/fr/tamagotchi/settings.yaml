devtools:
  title: Développeur
  pages:
    context-flow:
      title: Flux contextuel
    lag-visualizer:
      title: Visualiseur de latence
    performance-visualizer:
      title: Visualiseur de performance
      description: Afficher l'overlay FPS / tâches longues / mémoire
    markdown-stress:
      title: Test de charge Markdown
      description: Tester l'analyse et le rendu Markdown avec des charges de chat lourdes
    widgets-calling:
      title: Appel de widgets
      description: Créez, mettez à jour et supprimez des widgets flottants pour tester l’intégration du bureau.
      hint: Utilisez les préréglages pour remplir rapidement les props du composant avant l’envoi.
      presets:
        weather:
          label: Préréglage météo
          data:
            city: Tokyo
            condition: Pluie légère
        map:
          label: Préréglage carte
          data:
            title: Trajet vers l’aéroport
            mode: Navette aéroport
            status: À l’heure
            origin: Maison
            stop_1: Arrêt 1
            stop_2: Correspondance
            stop_3: Terminal
      size_presets:
        small: Petit
        medium: Moyen
        large: Grand
        custom: Personnalisé
      fields:
        widget_id:
          label: ID du widget
          description: Réutilisez un ID existant pour remplacer ou mettre à jour cette fenêtre de widget.
          placeholder: Laisser vide pour générer automatiquement
        component_name:
          label: Nom du composant
          description: Composant de widget enregistré à afficher, par exemple weather ou map.
          placeholder: weather
        size_preset:
          label: Préréglage de taille
          description: Choisissez une taille prédéfinie ou passez à une grille personnalisée.
          placeholder: Sélectionnez un préréglage...
        custom_columns:
          label: Colonnes personnalisées
          description: Colonnes de grille utilisées lorsque la taille est personnalisée.
        custom_rows:
          label: Lignes personnalisées
          description: Lignes de grille utilisées lorsque la taille est personnalisée.
        ttl:
          label: Suppression automatique après (secondes)
          description: Définissez 0 pour conserver le widget jusqu’à sa suppression manuelle.
        component_props:
          label: Props du composant (JSON)
          description: Charge utile JSON transmise au composant du widget.
      actions:
        spawn_replace: Créer / Remplacer le widget
        update_props: Mettre à jour les props
        remove_widget: Supprimer le widget
        clear_all: Tout supprimer
      feedback:
        spawned: 'La fenêtre du widget est prête{suffix}'
        updated: 'Widget {id} mis à jour'
        removed: 'Widget {id} supprimé'
        cleared: Tous les widgets ont été supprimés
      errors:
        invalid_json: 'JSON invalide : {error}'
        invalid_ttl: Le TTL doit être 0 ou un nombre positif.
        component_name_required: Le nom du composant est requis.
        spawn_failed: Impossible de créer le widget.
        widget_id_required_update: L’ID du widget est requis pour mettre à jour les props.
        update_failed: Impossible de mettre à jour les props du widget.
        widget_id_required_remove: L’ID du widget est requis pour le supprimer.
        remove_failed: Impossible de supprimer le widget.
        clear_failed: Impossible d’effacer les widgets.
