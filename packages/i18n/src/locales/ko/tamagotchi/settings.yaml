pages:
  modules:
    mcp-server:
      description: MCP 서버 및 도구 연결 및 관리
      title: MCP 서버
  system:
    sections:
      section:
        window-shortcuts:
          title: 키보드 단축키
    window-shortcuts:
      description: 창 바로 가기를 수정합니다.
      title: 창 바로 가기
      toggle-move:
        label: 이동 켜기/끄기
      toggle-resize:
        label: 크기 조정 켜기/끄기
      toggle-ignore-mouse-event:
        label: 마우스 이벤트 무시 켜기/끄기
      press-keys: 키를 누르세요...
    developer:
      sections:
        section:
          use-window-mouse:
            title: useWindowMouse 도구
            description: Electron 창 커서 위치 테스트
          relative-mouse:
            formula_x: 'relativeX = cursorX - windowX'
            formula_y: 'relativeY = cursorY - windowY'
            window: '창 {width} x {height}'
            center: '중심 ({x}, {y})'
            legend: 초록 점은 창 내부 기준 현재 커서 위치입니다
devtools:
  title: 개발자 옵션
  pages:
    context-flow:
      title: 컨텍스트 흐름
    lag-visualizer:
      title: 로그 비주얼라이저
    performance-visualizer:
      title: 성능 비주얼라이저
      description: FPS/긴 작업/메모리 오버레이 전환
    markdown-stress:
      title: 마크다운 스트레스
      description: 스트레스 마크다운 구문 분석 및 대량 채팅 페이로드 렌더링
    widgets-calling:
      title: 위젯 호출
      description: 데스크톱 통합 테스트를 위해 떠다니는 위젯을 생성, 업데이트, 제거합니다.
      hint: 프리셋을 사용하면 전송 전에 컴포넌트 props 를 빠르게 채울 수 있습니다.
      presets:
        weather:
          label: 날씨 프리셋
          data:
            city: 도쿄
            condition: 약한 비
        map:
          label: 지도 프리셋
          data:
            title: 공항 경로
            mode: 공항 버스
            status: 정시
            origin: 집
            stop_1: 정류장 1
            stop_2: 환승
            stop_3: 터미널
      size_presets:
        small: 작게
        medium: 중간
        large: 크게
        custom: 사용자 지정
      fields:
        widget_id:
          label: 위젯 ID
          description: 기존 위젯 ID 를 재사용하면 해당 위젯 창을 교체하거나 업데이트합니다.
          placeholder: 비워 두면 자동 생성
        component_name:
          label: 컴포넌트 이름
          description: '렌더링할 등록된 위젯 컴포넌트 이름입니다. 예: weather 또는 map'
          placeholder: weather
        size_preset:
          label: 크기 프리셋
          description: 미리 정의된 크기를 선택하거나 사용자 지정 그리드 크기로 전환합니다.
          placeholder: 크기 프리셋 선택...
        custom_columns:
          label: 사용자 지정 열 수
          description: 크기 프리셋이 사용자 지정일 때 사용할 그리드 열 수입니다.
        custom_rows:
          label: 사용자 지정 행 수
          description: 크기 프리셋이 사용자 지정일 때 사용할 그리드 행 수입니다。
        ttl:
          label: 자동 제거 시간(초)
          description: 0 으로 두면 수동으로 제거할 때까지 위젯을 유지합니다.
        component_props:
          label: 컴포넌트 Props (JSON)
          description: 위젯 컴포넌트에 전달할 JSON 데이터입니다.
      actions:
        spawn_replace: 생성 / 교체
        update_props: Props 업데이트
        remove_widget: 위젯 제거
        clear_all: 모든 위젯 지우기
      feedback:
        spawned: '위젯 창 준비 완료{suffix}'
        updated: '위젯 {id} 업데이트 완료'
        removed: '위젯 {id} 제거 완료'
        cleared: 모든 위젯을 제거했습니다
      errors:
        invalid_json: '잘못된 JSON: {error}'
        invalid_ttl: TTL 은 0 또는 양수여야 합니다.
        component_name_required: 컴포넌트 이름은 필수입니다.
        spawn_failed: 위젯 생성에 실패했습니다.
        widget_id_required_update: Props 를 업데이트하려면 위젯 ID 가 필요합니다.
        update_failed: 위젯 props 업데이트에 실패했습니다.
        widget_id_required_remove: 위젯을 제거하려면 위젯 ID 가 필요합니다.
        remove_failed: 위젯 제거에 실패했습니다.
        clear_failed: 위젯 일괄 제거에 실패했습니다.
inlay:
