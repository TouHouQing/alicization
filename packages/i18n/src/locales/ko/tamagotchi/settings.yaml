    links: 링크
  links:
    home: 홈
    documentation: 문서
    github: GitHub
  update:
    actions:
      download: 업데이트 다운로드
      checking: 업데이트 확인 중...
      latest: 최신 버전입니다
      disabled: 업데이트 비활성화됨
      retry: 다시 시도
      check: 업데이트 확인
      restart: 다시 시작하여 설치
      confirm_restart: 다시 시작 후 설치
      cancel: 취소
      confirm_download: 지금 다운로드
      download_short: 다운로드
    status:
      downloading: 업데이트 다운로드 중
      ready: '버전 {version} 준비가 완료되었습니다. 다시 시작해 설치를 마무리하세요.'
      error: '업데이트 확인에 실패했습니다: {error}'
      available_title: 업데이트 가능
      available_description: '버전 {version}을 다운로드할 수 있습니다. 먼저 릴리스 노트를 확인하세요.'
