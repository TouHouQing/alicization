      selection: 선택
      menu: 메뉴
      popover: 팝오버
      sidebar: 사이드바
      header: 헤더
      sheet: 시트
      window: 창
      hud: HUD
      fullscreen_ui: 전체 화면 UI
      tooltip: 툴팁
      content: 콘텐츠
      under_window: 창 아래
      under_page: 페이지 아래
  background_material:
    label: 배경 재질
    description: 가능할 경우 Windows 시스템 재질을 적용합니다.
