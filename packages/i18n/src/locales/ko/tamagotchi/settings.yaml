      none: 없음
      mica: Mica
      acrylic: Acrylic
      tabbed: 탭형
screen-capture:
  permissions-prompt:
    title: 화면 캡쳐
    description: 화면이나 창을 캡쳐하기 위해선 화면 및 시스템 오디오 녹음 권한이 필요합니다.
    open-preferences: 시스템 환경설정 열기
    dismiss: 무시
    instructions:
      step-1: '"시스템 환경설정"을 열고 사이드 바에서 "프라이버시 및 보안"을 선택합니다.'
      step-2: '"화면 및 시스템 오디오 녹음" 및 "시스템 오디오 녹음 전용" 섹션에서 Alicization에 대한 스위치를 켭니다.'
      step-2-note: Alicization가 목록에 없는 경우, "+" 버튼을 클릭하고 애플리케이션 폴더에서 Alicization를 선택하여 수동으로 추가해 주세요.
  devtools:
    categories:
      applications: 애플리케이션
      displays: 디스플레이
      devices: 장치
    actions:
      loading: 불러오는 중...
      refetching: 새로 고치는 중...
      refetch: 새로 고침
      share_screen: 화면 공유
      share_device: 장치 공유
      share_window: 창 공유
      stop: 중지
    capture_status: 활성 캡처
    loading_sources: 캡처 소스를 불러오는 중...
    alt:
      thumbnail: 캡처 소스 썸네일
      screen_icon: 화면 아이콘
      window_icon: 창 아이콘
    empty:
      title: 이 카테고리에 소스가 없습니다
      description: 다른 카테고리를 시도하거나 캡처 소스 목록을 새로 고치세요.
