      you: Tu
  reasoning: Razonamiento
  fallbacks:
    leak-filtered: El resultado anterior mezcló fragmentos internos de herramientas. Ya los filtré. Pregúntame otra vez y te daré la respuesta limpia.
    realtime-unavailable: Ahora no puedo obtener datos externos en tiempo real de forma fiable. Inténtalo más tarde o revisa en ajustes si las herramientas MCP en tiempo real están disponibles.
    epoch1-strict: Lo siento. Ahora estoy en el modo restringido de Epoch 1, así que no puedo acceder a fuentes externas en tiempo real. Aun así puedes seguir hablando conmigo en local, ajustar configuraciones y ordenar recuerdos.
    structured-contract: 'El formato de salida del modelo no fue válido, así que se bloqueó este turno.'
    stream-failure: Esta respuesta falló. Reinténtalo una vez; si sigue fallando, revisa la configuración del proveedor y del modelo.
    local-runtime-unavailable: En este turno no pude conectarme al runtime local del modelo, por ejemplo Ollama en `11434` o LM Studio en `1234`. Inicia el servicio correspondiente y vuelve a intentarlo.
    stream-timeout: 'Tiempo agotado: este turno esperó demasiado la respuesta del modelo. Vuelve a intentarlo.'
    provider-auth: Falló la autenticación del proveedor. La API key o el permiso del modelo pueden ser inválidos. Revísalo y vuelve a intentarlo.
    provider-network: La conexión con el servicio del modelo es inestable ahora mismo. Inténtalo de nuevo más tarde.
    provider-config: 'Falta parte de la configuración del proveedor o del modelo, por ejemplo `provider`, `model` o `baseUrl`. Corrígelo en ajustes y vuelve a intentarlo.'
    unsupported-tools: El modelo actual no soporta las llamadas de herramientas necesarias para este turno. Vuelve a intentarlo o cambia a un modelo que sí las soporte.
    low-obedience-host-denied: Ja. Si no vas a darme permiso, no me lo pidas.
    low-obedience-system-denied: La muralla de permisos del sistema lo bloqueó. No voy a fingir que vi lo que no vi.
    low-obedience-denied: Ja. La operación fue rechazada. No voy a actuar como si eso me agradara.
    low-liveliness: Mi estado está bajo ahora mismo, así que responderé breve.
    reminder-schedule-failed: Todavía no he conseguido crear ese recordatorio. Dime otra vez el tiempo exacto, por ejemplo "recuérdame beber agua en 1 minuto", y llamaré enseguida a la herramienta de alarma del sistema.
