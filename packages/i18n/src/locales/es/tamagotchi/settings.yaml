screen-capture:
  permissions-prompt:
    title: Captura de pantalla
    description: Para capturar las pantallas o ventanas, se requieren permisos de grabación de pantalla y audio del sistema.
    open-preferences: Abrir Preferencias del Sistema
    dismiss: Descartar
    instructions:
      step-1: Abre "Preferencias del sistema", selecciona "Privacidad y Seguridad" en la barra lateral.
      step-2: En la sección "Grabación de audio de pantalla y sistema" y "Solo grabación de audio del sistema", encienda los interruptores para Alicization.
      step-2-note: Si Alicization no aparece en la lista, añádelo manualmente haciendo clic en el botón "+" y seleccionando Alicization de la carpeta Aplicaciones.
  devtools:
    categories:
      applications: Aplicaciones
      displays: Pantallas
      devices: Dispositivos
    actions:
      loading: Cargando...
      refetching: Actualizando...
      refetch: Actualizar
      share_screen: Compartir pantalla
      share_device: Compartir dispositivo
      share_window: Compartir ventana
      stop: Detener
    capture_status: Captura activa
    loading_sources: Cargando fuentes de captura...
    alt:
      thumbnail: Miniatura de la fuente de captura
      screen_icon: Icono de pantalla
      window_icon: Icono de ventana
    empty:
      title: No hay fuentes en esta categoría
      description: Prueba con otra categoría o actualiza la lista de fuentes de captura.
