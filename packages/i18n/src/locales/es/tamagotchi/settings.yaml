devtools:
  title: Desarrollador
  pages:
    context-flow:
      title: Flujo de contexto
    lag-visualizer:
      title: Visualizador de retraso
    performance-visualizer:
      title: Visualizador de rendimiento
      description: Cambiar FPS/tareas largas/superposición de memoria
    markdown-stress:
      title: Estrés por Markdown
      description: Análisis y renderizado de Markdown bajo estrés con cargas de chat pesadas
    widgets-calling:
      title: Llamada de Widget
      description: Crea, actualiza y elimina widgets flotantes para probar la integración del escritorio.
      hint: Usa los preajustes para rellenar rápidamente las props del componente antes de enviarlo.
      presets:
        weather:
          label: Preajuste del clima
          data:
            city: Tokio
            condition: Lluvia ligera
        map:
          label: Preajuste de mapa
          data:
            title: Ruta al aeropuerto
            mode: Autobús al aeropuerto
            status: En horario
            origin: Casa
            stop_1: Parada 1
            stop_2: Transbordo
            stop_3: Terminal
      size_presets:
        small: Pequeño
        medium: Mediano
        large: Grande
        custom: Personalizado
      fields:
        widget_id:
          label: ID del widget
          description: Reutiliza un ID existente para reemplazar o actualizar esa ventana del widget.
          placeholder: Déjalo vacío para generarlo automáticamente
        component_name:
          label: Nombre del componente
          description: Componente de widget registrado que se renderizará, por ejemplo weather o map.
          placeholder: weather
        size_preset:
          label: Preajuste de tamaño
          description: Elige un tamaño predefinido o cambia a dimensiones de cuadrícula personalizadas.
          placeholder: Selecciona un preajuste...
        custom_columns:
          label: Columnas personalizadas
          description: Columnas de la cuadrícula usadas cuando el tamaño es personalizado.
        custom_rows:
          label: Filas personalizadas
          description: Filas de la cuadrícula usadas cuando el tamaño es personalizado.
        ttl:
          label: Autoeliminar después de (segundos)
          description: Usa 0 para mantener el widget hasta quitarlo manualmente.
        component_props:
          label: Props del componente (JSON)
          description: Carga JSON que se pasa al componente del widget.
      actions:
        spawn_replace: Crear / Reemplazar widget
        update_props: Actualizar props
        remove_widget: Eliminar widget
        clear_all: Limpiar todos los widgets
      feedback:
        spawned: 'La ventana del widget está lista{suffix}'
        updated: 'Se actualizó el widget {id}'
        removed: 'Se eliminó el widget {id}'
        cleared: Se eliminaron todos los widgets
      errors:
        invalid_json: 'JSON no válido: {error}'
        invalid_ttl: El TTL debe ser 0 o un número positivo.
        component_name_required: El nombre del componente es obligatorio.
        spawn_failed: No se pudo crear el widget.
        widget_id_required_update: El ID del widget es obligatorio para actualizar las props.
        update_failed: No se pudieron actualizar las props del widget.
        widget_id_required_remove: El ID del widget es obligatorio para eliminarlo.
        remove_failed: No se pudo eliminar el widget.
        clear_failed: No se pudieron limpiar los widgets.
