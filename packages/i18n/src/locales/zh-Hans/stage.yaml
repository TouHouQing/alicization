    provider-network: 当前到模型服务的网络连接不稳定。请稍后重试。
    provider-config: 当前提供方或模型配置不完整，例如 `provider`、`model` 或 `baseUrl` 缺失。请在设置里确认后再试一次。
    unsupported-tools: 当前模型不支持这轮所需的工具调用。请重试一次，或切换到支持工具调用的模型。
    low-obedience-host-denied: 呵，不给我权限，就别让我替你做。
    low-obedience-system-denied: 系统权限墙把它挡住了。我不会假装自己看见了没看见的东西。
    low-obedience-denied: 呵，操作被拒绝了。我不会装作这很愉快。
    low-liveliness: 我现在状态偏低，先简短回复。
    reminder-schedule-failed: 我这轮还没有成功设置提醒。请再告诉我一次准确时长，比如“1分钟后提醒我喝水”，我会立即调用系统闹钟工具。
  mind-fallback:
    focus-default: '当前这件事'
    repair-stale-anchor: '我先纠正一下：刚才那是旧锚点，不该继续当成你现在的画面。'
    repair-need-reground: '我先守住真实边界：这轮没有足够稳的实时画面根据，我不把旧记忆当成当前屏幕。'
    guide-opening: '先抓当前这个点：{focus}。'
    care-opening: '我先按你现在的状态说：{focus}。'
    accompany-opening: '我先陪你把这条线稳住：{focus}。'
    observation-opening: '我先说这轮我能稳住的部分：{focus}。'
    answer-opening: '先按你眼前这件事说：{focus}。'
    carry-memory: '我还记着上一条线是 {carry}，但那是我还在续持的线程，不是我断定你现在屏幕上的内容。'
    reground-note: '如果你要我具体到当前屏幕细节，我会按这次的新画面重新落地。'
  reminder:
    default-message: 你刚才让我记住的那件事
  kill-switch:
    suspended: 已进入强制休眠模式，执行链路已暂停。
    resumed: 已恢复运行，执行链路重新启用。
  errors:
    privacy-blocked: Alicization 为了保护隐私，已阻止这次对外请求。
    suspended: Alicization 当前处于休眠状态。发送“Alicization，恢复”即可唤醒。
    session-not-ready: 聊天会话尚未准备好。请在初始化完成后重试。
    session-reset-before-send: 聊天会话在发送开始前已被重置。
    turn-aborted: Alicization 对话轮次已中止（{reason}）
  stream:
    aborted: 'Alicization 流已中止：{reason}'
    error: Alicization 流发生错误
    failed: Alicization 流失败
    superseded: 'Alicization 流已被重启的新轮次覆盖：{turnId}。'
    start-rejected: 'Alicization 流启动被拒绝，轮次 {turnId}（state={state}）。'
    start-rejected-with-reason: 'Alicization 流启动被拒绝，轮次 {turnId}（state={state}，reason={reason}）。'
    renderer-unmounted: Alicization 流完成前，渲染器已卸载。
    turn-aborted: '对话已中止：{reason}'
    server-failed: 服务端流失败。
    invalid-event: 服务端流事件载荷无效。
    unsupported-event: 不支持的服务端流事件类型。
    proxy-failed: 'Alicization 服务端聊天代理失败：{reason}'
    proxy-no-body: Alicization 服务端聊天代理未返回响应体。
    reason-manual: 手动
    reason-aborted: 已中止
