chat:
  message:
    character-name:
      airi: ALICIZATION
      core-system: 核心系统
      you: 你
  reasoning: 思考
  fallbacks:
    leak-filtered: 我刚才的结果里混入了内部工具片段，已经替你过滤掉了。你再问一次，我会直接给你整理后的答案。
    realtime-unavailable: 当前无法获取可靠的实时外部数据。请稍后重试，或在设置里检查 MCP 实时工具是否可用。
    epoch1-strict: 抱歉，当前是受限的 Epoch 1 模式，我无法访问实时外部数据源。你仍然可以继续和我本地对话、调整设定、整理记忆。
    structured-contract: 我在。你继续说，我会尽量给你稳定清晰的回复。
    stream-failure: 我这轮回复失败了。请先重试一次；如果连续失败，再检查提供方和模型配置。
    local-runtime-unavailable: 我这轮没有连上本地模型服务，例如 `11434` 上的 Ollama 或 `1234` 上的 LM Studio。请先启动对应服务，再试一次。
    stream-timeout: 我这轮等待模型响应超时了，服务可能正忙。请重试一次。
