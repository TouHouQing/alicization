devtools:
  title: 开发者选项
  pages:
    context-flow:
      title: Context Flow
    lag-visualizer:
      title: Lag 可视化
    performance-visualizer:
      title: 性能可视化
      description: 切换 FPS/长任务/内存叠加
    markdown-stress:
      title: Markdown Stress
      description: 用大量聊天负载来测试 Markdown 的解析和渲染能力
    widgets-calling:
      title: 挂件调用
      description: 用于生成、更新和移除桌面悬浮挂件，便于联调桌面挂件能力。
      hint: 先套用预设可快速填充组件参数，再发起挂件调用。
      presets:
        weather:
          label: 天气预设
          data:
            city: 东京
            condition: 小雨
        map:
          label: 地图预设
          data:
            title: 机场路线
            mode: 机场巴士
            status: 准点
            origin: 家
            stop_1: 第一站
            stop_2: 换乘点
            stop_3: 航站楼
      size_presets:
        small: 小
        medium: 中
        large: 大
        custom: 自定义
      fields:
        widget_id:
          label: 挂件 ID
          description: 复用已有挂件 ID 时，会直接替换或更新对应窗口。
          placeholder: 留空则自动生成
        component_name:
          label: 组件名称
          description: 要渲染的挂件组件名称，例如 weather 或 map。
          placeholder: weather
        size_preset:
          label: 尺寸预设
          description: 选择一个预设尺寸，或切换到自定义网格大小。
          placeholder: 请选择尺寸预设...
        custom_columns:
          label: 自定义列数
          description: 当尺寸为自定义时使用的网格列数。
        custom_rows:
          label: 自定义行数
          description: 当尺寸为自定义时使用的网格行数。
        ttl:
          label: 自动移除时间（秒）
          description: 设为 0 表示保留挂件，直到手动移除。
        component_props:
          label: 组件参数（JSON）
          description: 传递给挂件组件的 JSON 数据。
      actions:
        spawn_replace: 创建 / 替换挂件
        update_props: 更新参数
        remove_widget: 移除挂件
        clear_all: 清空全部挂件
      feedback:
        spawned: '挂件窗口已就绪{suffix}'
        updated: '已更新挂件 {id}'
        removed: '已移除挂件 {id}'
        cleared: 已清空全部挂件
      errors:
        invalid_json: 'JSON 无效：{error}'
        invalid_ttl: TTL 必须为 0 或正数。
        component_name_required: 组件名称不能为空。
        spawn_failed: 创建挂件失败。
        widget_id_required_update: 更新参数时必须填写挂件 ID。
        update_failed: 更新挂件参数失败。
        widget_id_required_remove: 移除挂件时必须填写挂件 ID。
        remove_failed: 移除挂件失败。
        clear_failed: 清空挂件失败。
