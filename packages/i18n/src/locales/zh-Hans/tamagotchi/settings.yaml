screen-capture:
  permissions-prompt:
    title: 屏幕捕获
    description: 要捕获屏幕或窗口，需要屏幕和系统音频录制权限。
    open-preferences: 打开系统偏好设置
    dismiss: 取消
    instructions:
      step-1: 打开「系统首选项」，从侧边栏选择「隐私与安全」。
      step-2: 在「屏幕和系统音频录制」和「系统音频录制」部分中，开启 Alicization 的开关。
      step-2-note: 如果没有列出 Alicization，请通过单击「+」按钮和从应用程序文件夹中选择 Alicization 来手动添加。
  devtools:
    categories:
      applications: 应用窗口
      displays: 显示器
      devices: 设备
    actions:
      loading: 加载中...
      refetching: 刷新中...
      refetch: 刷新
      share_screen: 共享屏幕
      share_device: 共享设备
      share_window: 共享窗口
      stop: 停止
    capture_status: 当前正在共享
    loading_sources: 正在加载可捕获来源...
    alt:
      thumbnail: 捕获来源缩略图
      screen_icon: 屏幕图标
      window_icon: 窗口图标
    empty:
      title: 当前分类下没有可用来源
      description: 请切换分类，或刷新捕获来源列表后重试。
